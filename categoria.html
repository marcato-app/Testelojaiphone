<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Categoria — Órbita Tech</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><circle cx=%2212%22 cy=%2212%22 r=%229%22 fill=%22%230071e3%22/></svg>">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<div id="nav-root"></div>

<main class="container" style="padding-top:24px;">
  <div class="section-head" style="margin-top:16px;">
    <h1 class="section-title" id="cat-title" style="font-size:32px;"></h1>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px;" id="cat-filters"></div>
  <div class="grid grid-3" id="cat-grid"></div>
  <p id="cat-empty" hidden style="color:var(--text-tertiary);padding:40px 0;text-align:center;">Nenhuma matéria encontrada nesta editoria ainda.</p>
</main>

<div id="footer-root"></div>

<script src="assets/js/seed-data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/render.js"></script>
<script>
  renderNav();
  renderFooter();

  function renderCategoryPage() {
    const params = new URLSearchParams(location.search);
    const cat = params.get("c");
    const all = Store.categories();
    document.getElementById("cat-filters").innerHTML = ["Todas"].concat(all).map(c => {
      const active = (c === "Todas" && !cat) || c === cat;
      const href = c === "Todas" ? "categoria.html" : `categoria.html?c=${encodeURIComponent(c)}`;
      return `<a class="tag-pill${active ? "" : ""}" style="${active ? "background:var(--accent);color:#fff;border-color:transparent;" : ""}" href="${href}">${c}</a>`;
    }).join("");

    document.getElementById("cat-title").textContent = cat ? cat : "Todas as matérias";
    const posts = Store.sortedByDate(Store.getAll().filter(p => !cat || p.category === cat));
    document.getElementById("cat-grid").innerHTML = posts.map(renderCard).join("");
    document.getElementById("cat-empty").hidden = posts.length > 0;
    setupRevealAnimations();
  }
  renderCategoryPage();
</script>
</body>
</html>
