<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Block Blast</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #0a0a0f;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 12px;
    overflow-x: hidden;
    touch-action: manipulation;
  }
  #game-app {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
    -webkit-user-select: none;
  }
  .game-header { text-align: center; margin-bottom: 12px; width: 100%; }
  .game-title { font-size: 22px; font-weight: 600; margin-bottom: 2px; color: #fff; }
  .game-sub { font-size: 12px; color: #888; }
  .score-row { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 10px; }
  .score-box { text-align: center; flex: 1; }
  .score-label { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 1px; }
  .score-val { font-size: 20px; font-weight: 600; color: #fff; font-variant-numeric: tabular-nums; }
  .level-badge { background: #1a1a2e; padding: 4px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; border: 1px solid rgba(255,255,255,0.08); color: #ccc; }
  .progress-wrap { width: 100%; margin-bottom: 10px; }
  .progress-bar { height: 4px; background: #1a1a2e; border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: #e94560; border-radius: 2px; transition: width 0.3s ease; }
  .board-wrap { position: relative; width: 100%; aspect-ratio: 1; background: #141428; border-radius: 12px; padding: 10px; margin-bottom: 14px; border: 1px solid rgba(255,255,255,0.06); }
  .board-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; width: 100%; height: 100%; }
  .cell { background: #1a1a3a; border-radius: 4px; transition: all 0.15s ease; position: relative; }
  .cell.filled { box-shadow: inset 0 1px 0 rgba(255,255,255,0.15); }
  .cell.explode { animation: explode 0.35s ease forwards; }
  .cell.hint { box-shadow: 0 0 0 2px #3b82f6, 0 0 12px #3b82f680; z-index: 2; }
  .cell.bomb-hover:hover { box-shadow: 0 0 0 2px #ef4444; }
  @keyframes explode { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.8; background: #fff; } 100% { transform: scale(0); opacity: 0; } }
  .tray-area { width: 100%; background: #141428; border-radius: 12px; padding: 12px; border: 1px solid rgba(255,255,255,0.06); margin-bottom: 12px; }
  .tray-label { font-size: 11px; color: #555; text-align: center; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .tray-pieces { display: flex; justify-content: center; gap: 16px; min-height: 80px; align-items: center; }
  .piece-slot { width: 80px; height: 80px; display: flex; justify-content: center; align-items: center; border-radius: 8px; border: 1px dashed rgba(255,255,255,0.08); position: relative; }
  .piece { display: grid; gap: 2px; cursor: grab; position: relative; transition: transform 0.1s; touch-action: none; }
  .piece:active { cursor: grabbing; transform: scale(1.05); }
  .piece.dragging { position: fixed; z-index: 9999; pointer-events: none; opacity: 0.9; transform: scale(1.1); }
  .p-cell { width: 18px; height: 18px; border-radius: 3px; }
  .p-cell.active { box-shadow: inset 0 1px 0 rgba(255,255,255,0.2); }
  .p-cell.ghost { background: transparent; }
  .powerups { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; width: 100%; }
  .pu-btn { padding: 8px 14px; border-radius: 8px; border: 1.5px solid; font-size: 12px; font-weight: 600; cursor: pointer; background: transparent; transition: all 0.2s; font-family: inherit; }
  .pu-btn.hint-btn { border-color: #3b82f6; color: #3b82f6; }
  .pu-btn.bomb-btn { border-color: #ef4444; color: #ef4444; }
  .pu-btn:hover { background: rgba(255,255,255,0.05); }
  .pu-btn.active { background: rgba(255,255,255,0.1); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.88); display: none; justify-content: center; align-items: center; z-index: 10000; backdrop-filter: blur(4px); }
  .modal-overlay.show { display: flex; }
  .modal-box { background: #1a1a2e; border-radius: 16px; padding: 28px; text-align: center; max-width: 320px; width: 90%; border: 1px solid rgba(255,255,255,0.08); animation: modalIn 0.3s ease; }
  @keyframes modalIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
  .modal-title { font-size: 24px; font-weight: 600; margin-bottom: 4px; }
  .modal-sub { color: #888; font-size: 13px; margin-bottom: 16px; }
  .modal-score { font-size: 40px; font-weight: 600; margin: 8px 0; font-variant-numeric: tabular-nums; color: #fff; }
  .modal-btn { width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 10px; font-family: inherit; transition: opacity 0.2s; }
  .modal-btn:hover { opacity: 0.9; }
  .btn-primary { background: #e94560; color: #fff; }
  .btn-secondary { background: #1a1a3a; color: #ccc; border: 1px solid rgba(255,255,255,0.1); }
  .btn-success { background: #10b981; color: #fff; }
  .game-over-title { color: #ef4444; }
  .level-title { color: #10b981; }
  .ad-banner { width: 100%; height: 50px; background: #0d0d12; border-radius: 8px; display: flex; align-items: center; justify-content: center; border: 1px dashed rgba(255,255,255,0.08); margin-top: 6px; }
  .ad-text { font-size: 10px; color: #444; text-transform: uppercase; letter-spacing: 1px; }
  .shake { animation: shake 0.3s ease; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .combo-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 28px; font-weight: 700; color: #fbbf24; pointer-events: none; opacity: 0; animation: comboPop 0.9s ease forwards; z-index: 100; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
  @keyframes comboPop { 0%{opacity:0;transform:translate(-50%,-50%) scale(0.4)} 40%{opacity:1;transform:translate(-50%,-50%) scale(1.3)} 100%{opacity:0;transform:translate(-50%,-120%) scale(1)} }
  .reset-btn { position: fixed; top: 10px; right: 10px; background: #1a1a2e; border: 1px solid rgba(255,255,255,0.1); color: #666; padding: 6px 12px; border-radius: 6px; font-size: 11px; cursor: pointer; z-index: 999; }
  .reset-btn:hover { color: #fff; }
</style>
</head>
<body>
<div id="game-app">
  <button class="reset-btn" onclick="hardReset()">Resetar progresso</button>
  <div class="game-header">
    <div class="game-title">Block Blast</div>
    <div class="game-sub">Encaixe as peças. Complete linhas e colunas.</div>
  </div>

  <div class="score-row">
    <div class="score-box">
      <div class="score-label">Nível</div>
      <div class="score-val" id="level-display">1</div>
    </div>
    <div class="level-badge" id="target-display">Alvo: 500 pts</div>
    <div class="score-box">
      <div class="score-label">Recorde</div>
      <div class="score-val" id="high-display">0</div>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>

  <div class="score-row" style="margin-bottom:8px;">
    <div class="score-box">
      <div class="score-label">Pontos</div>
      <div class="score-val" id="score-display">0</div>
    </div>
    <div class="score-box">
      <div class="score-label">Linhas</div>
      <div class="score-val" id="lines-display">0</div>
    </div>
  </div>

  <div class="powerups">
    <button class="pu-btn hint-btn" id="btn-hint" onclick="useHint()">💡 Dica</button>
    <button class="pu-btn bomb-btn" id="btn-bomb" onclick="useBomb()">💣 Bomba</button>
  </div>

  <div class="board-wrap" id="board-wrap">
    <div class="board-grid" id="board"></div>
  </div>

  <div class="tray-area">
    <div class="tray-label">Arraste as peças para o grid</div>
    <div class="tray-pieces" id="tray"></div>
  </div>

  <div class="ad-banner"><span class="ad-text">Banner AdMob — ca-app-pub-xxx</span></div>

  <div class="modal-overlay" id="modal-gameover">
    <div class="modal-box">
      <div class="modal-title game-over-title">Game Over</div>
      <div class="modal-sub">Nível <span id="go-level"></span> alcançado</div>
      <div class="modal-score" id="go-score">0</div>
      <button class="modal-btn btn-success" onclick="reviveGame()">▶ Assistir vídeo para continuar</button>
      <button class="modal-btn btn-secondary" onclick="restartGame()">Tentar novamente</button>
    </div>
  </div>

  <div class="modal-overlay" id="modal-level">
    <div class="modal-box">
      <div class="modal-title level-title">Nível Concluído! 🎉</div>
      <div class="modal-sub">Você avançou de nível</div>
      <div class="modal-score" id="lv-score">0</div>
      <button class="modal-btn btn-primary" onclick="nextLevel()">Próximo Nível →</button>
    </div>
  </div>
</div>

<script>
(function(){
  const GRID = 8;
  const CELL_COLORS = {
    I: '#00d9ff', O: '#ffd700', T: '#ff2e63', L: '#08d9d6',
    J: '#ff9f1c', S: '#7bff00', Z: '#ff0055', single: '#a855f7',
    bigL: '#f472b6', cross: '#22d3ee'
  };
  const SHAPES = {
    I: [[1,1,1,1]],
    O: [[1,1],[1,1]],
    T: [[1,1,1],[0,1,0]],
    L: [[1,0],[1,0],[1,1]],
    J: [[0,1],[0,1],[1,1]],
    S: [[0,1,1],[1,1,0]],
    Z: [[1,1,0],[0,1,1]],
    single: [[1]],
    bigL: [[1,0,0],[1,0,0],[1,1,1]],
    cross: [[0,1,0],[1,1,1],[0,1,0]]
  };
  const KEYS = ['I','O','T','L','J','S','Z','single','bigL','cross'];

  let board = Array(GRID).fill(null).map(()=>Array(GRID).fill(null));
  let pieces = [null,null,null];
  let level = 1, score = 0, highScore = 0, linesTotal = 0, placedCount = 0;
  let hintPos = null, bombMode = false, gameOver = false, levelComplete = false;
  let draggingPiece = null, dragEl = null, dragOffset = {x:0,y:0};

  function loadState() {
    try {
      const s = JSON.parse(localStorage.getItem('blockblast_save')||'null');
      if (s) { level=s.level||1; score=s.score||0; highScore=s.highScore||0; linesTotal=s.linesTotal||0; board=s.board||board; pieces=s.pieces||pieces; placedCount=s.placedCount||0; }
    } catch(e){}
    const hs = parseInt(localStorage.getItem('blockblast_hs')||'0',10);
    if (hs > highScore) highScore = hs;
  }
  function saveState() {
    localStorage.setItem('blockblast_save', JSON.stringify({level,score,highScore,linesTotal,board,pieces,placedCount}));
    if (score > highScore) { highScore = score; localStorage.setItem('blockblast_hs', String(highScore)); }
  }
  window.hardReset = function() {
    if (confirm('Apagar todo o progresso?')) {
      localStorage.removeItem('blockblast_save');
      localStorage.removeItem('blockblast_hs');
      location.reload();
    }
  };

  function targetFor(lvl) {
    return { score: Math.floor(500 * Math.pow(1.3, lvl-1)), lines: Math.floor(3 * Math.pow(1.2, lvl-1)) };
  }

  function randPiece() {
    const k = KEYS[Math.floor(Math.random()*KEYS.length)];
    return { id: Math.random().toString(36).slice(2), type: k, shape: SHAPES[k].map(r=>[...r]) };
  }
  function genPieces() { return [randPiece(), randPiece(), randPiece()]; }

  function canPlace(shape, r0, c0) {
    for (let r=0;r<shape.length;r++) for (let c=0;c<shape[r].length;c++) if (shape[r][c]) {
      const R=r0+r, C=c0+c;
      if (R<0||R>=GRID||C<0||C>=GRID||board[R][C]!==null) return false;
    }
    return true;
  }
  function place(shape, r0, c0, type) {
    for (let r=0;r<shape.length;r++) for (let c=0;c<shape[r].length;c++) if (shape[r][c]) board[r0+r][c0+c] = type;
  }
  function checkClear() {
    const rows=[], cols=[];
    for (let r=0;r<GRID;r++) if (board[r].every(x=>x!==null)) rows.push(r);
    for (let c=0;c<GRID;c++) { let f=true; for (let r=0;r<GRID;r++) if (board[r][c]===null){f=false;break;} if (f) cols.push(c); }
    return {rows, cols, combo: rows.length>0 && cols.length>0};
  }
  function doClear(rows, cols) {
    rows.forEach(r=>{for(let c=0;c<GRID;c++) board[r][c]=null;});
    cols.forEach(c=>{for(let r=0;r<GRID;r++) board[r][c]=null;});
  }
  function hasPlacement(pcs) {
    for (const p of pcs) if (p) {
      for (let r=0;r<GRID;r++) for (let c=0;c<GRID;c++) if (canPlace(p.shape,r,c)) return true;
    }
    return false;
  }
  function findHint(p) {
    for (let r=0;r<GRID;r++) for (let c=0;c<GRID;c++) if (canPlace(p.shape,r,c)) return {r,c};
    return null;
  }

  function renderBoard() {
    const el = document.getElementById('board');
    el.innerHTML = '';
    for (let r=0;r<GRID;r++) {
      for (let c=0;c<GRID;c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.r = r; cell.dataset.c = c;
        if (board[r][c]) {
          cell.classList.add('filled');
          cell.style.background = CELL_COLORS[board[r][c]] || CELL_COLORS.single;
        }
        if (hintPos && hintPos.r===r && hintPos.c===c) cell.classList.add('hint');
        if (bombMode) {
          cell.style.cursor = 'crosshair';
          cell.classList.add('bomb-hover');
          cell.onclick = () => doBomb(r,c);
        }
        el.appendChild(cell);
      }
    }
  }

  function renderTray() {
    const el = document.getElementById('tray');
    el.innerHTML = '';
    pieces.forEach((p, idx) => {
      const slot = document.createElement('div');
      slot.className = 'piece-slot';
      if (!p) { el.appendChild(slot); return; }
      const pieceEl = document.createElement('div');
      pieceEl.className = 'piece';
      pieceEl.dataset.idx = idx;
      pieceEl.style.gridTemplateColumns = `repeat(${p.shape[0].length}, 18px)`;
      p.shape.forEach(row => {
        row.forEach(cell => {
          const d = document.createElement('div');
          d.className = 'p-cell ' + (cell ? 'active' : 'ghost');
          if (cell) d.style.background = CELL_COLORS[p.type];
          pieceEl.appendChild(d);
        });
      });
      setupDrag(pieceEl, p, idx);
      slot.appendChild(pieceEl);
      el.appendChild(slot);
    });
  }

  function setupDrag(el, piece, idx) {
    function start(e) {
      if (gameOver || levelComplete) return;
      e.preventDefault();
      const evt = e.touches ? e.touches[0] : e;
      draggingPiece = {piece, idx, el};
      const rect = el.getBoundingClientRect();
      dragOffset = {x: evt.clientX - rect.left, y: evt.clientY - rect.top};
      dragEl = el.cloneNode(true);
      dragEl.classList.add('dragging');
      dragEl.style.left = (evt.clientX - dragOffset.x) + 'px';
      dragEl.style.top = (evt.clientY - dragOffset.y) + 'px';
      document.body.appendChild(dragEl);
      el.style.opacity = '0.3';
    }
    function move(e) {
      if (!draggingPiece || !dragEl) return;
      e.preventDefault();
      const evt = e.touches ? e.touches[0] : e;
      dragEl.style.left = (evt.clientX - dragOffset.x) + 'px';
      dragEl.style.top = (evt.clientY - dragOffset.y) + 'px';
    }
    function end(e) {
      if (!draggingPiece || !dragEl) return;
      const evt = e.changedTouches ? e.changedTouches[0] : e;
      const boardRect = document.getElementById('board-wrap').getBoundingClientRect();
      const pad = 10, cellSize = (boardRect.width - pad*2) / GRID;
      const relX = evt.clientX - boardRect.left - pad;
      const relY = evt.clientY - boardRect.top - pad;
      const c = Math.round(relX / (cellSize + 3));
      const r = Math.round(relY / (cellSize + 3));
      dragEl.remove(); dragEl = null;
      draggingPiece.el.style.opacity = '1';
      attemptPlace(draggingPiece.piece, draggingPiece.idx, r, c);
      draggingPiece = null;
    }
    el.addEventListener('mousedown', start);
    el.addEventListener('touchstart', start, {passive:false});
    document.addEventListener('mousemove', move);
    document.addEventListener('touchmove', move, {passive:false});
    document.addEventListener('mouseup', end);
    document.addEventListener('touchend', end);
  }

  function attemptPlace(piece, idx, r, c) {
    if (!canPlace(piece.shape, r, c)) {
      document.getElementById('board-wrap').classList.add('shake');
      setTimeout(()=>document.getElementById('board-wrap').classList.remove('shake'), 300);
      return;
    }
    place(piece.shape, r, c, piece.type);
    score += 10;
    pieces[idx] = null;
    placedCount++;
    hintPos = null;

    const {rows, cols, combo} = checkClear();
    if (rows.length || cols.length) {
      const cells = document.querySelectorAll('.cell');
      rows.forEach(rr => { for(let cc=0;cc<GRID;cc++) cells[rr*GRID+cc].classList.add('explode'); });
      cols.forEach(cc => { for(let rr=0;rr<GRID;rr++) cells[rr*GRID+cc].classList.add('explode'); });
      if (combo) showCombo();
      setTimeout(() => {
        doClear(rows, cols);
        let pts = (rows.length + cols.length) * 100;
        if (combo) pts += 50;
        score += pts;
        linesTotal += rows.length + cols.length;
        updateUI();
        renderBoard();
        checkLevel();
      }, 350);
    } else {
      updateUI();
      renderBoard();
      checkLevel();
    }

    if (placedCount >= 3 || pieces.every(x=>x===null)) {
      setTimeout(() => { pieces = genPieces(); placedCount = 0; renderTray(); checkGameOver(); }, 400);
    } else {
      renderTray();
      setTimeout(checkGameOver, 100);
    }
    saveState();
  }

  function showCombo() {
    const txt = document.createElement('div');
    txt.className = 'combo-text';
    txt.textContent = 'COMBO!';
    document.getElementById('board-wrap').appendChild(txt);
    setTimeout(()=>txt.remove(), 900);
  }

  function checkLevel() {
    const t = targetFor(level);
    if (score >= t.score || linesTotal >= t.lines) {
      levelComplete = true;
      document.getElementById('lv-score').textContent = score.toLocaleString();
      document.getElementById('modal-level').classList.add('show');
      saveState();
    }
  }
  function checkGameOver() {
    const active = pieces.filter(x=>x!==null);
    if (active.length && !hasPlacement(active)) {
      gameOver = true;
      document.getElementById('go-level').textContent = level;
      document.getElementById('go-score').textContent = score.toLocaleString();
      document.getElementById('modal-gameover').classList.add('show');
      saveState();
    }
  }

  function updateUI() {
    document.getElementById('level-display').textContent = level;
    document.getElementById('score-display').textContent = score.toLocaleString();
    document.getElementById('lines-display').textContent = linesTotal;
    document.getElementById('high-display').textContent = highScore.toLocaleString();
    const t = targetFor(level);
    document.getElementById('target-display').textContent = `Alvo: ${t.score.toLocaleString()} pts`;
    const prog = Math.min(score / t.score, 1);
    document.getElementById('progress-fill').style.width = (prog * 100) + '%';
  }

  window.useHint = function() {
    if (gameOver || levelComplete) return;
    const active = pieces.find(x=>x!==null);
    if (!active) return;
    setTimeout(() => {
      const h = findHint(active);
      if (h) { hintPos = h; renderBoard(); setTimeout(()=>{hintPos=null; renderBoard();}, 3000); }
    }, 300);
  };
  window.useBomb = function() {
    if (gameOver || levelComplete) return;
    const btn = document.getElementById('btn-bomb');
    if (bombMode) { bombMode = false; btn.classList.remove('active'); renderBoard(); return; }
    setTimeout(() => { bombMode = true; btn.classList.add('active'); renderBoard(); }, 300);
  };
  function doBomb(r, c) {
    for (let rr=r-1; rr<=r+1; rr++) for (let cc=c-1; cc<=c+1; cc++)
      if (rr>=0&&rr<GRID&&cc>=0&&cc<GRID) board[rr][cc] = null;
    bombMode = false;
    document.getElementById('btn-bomb').classList.remove('active');
    renderBoard();
    saveState();
  }

  window.restartGame = function() {
    board = Array(GRID).fill(null).map(()=>Array(GRID).fill(null));
    pieces = genPieces(); level = 1; score = 0; linesTotal = 0; placedCount = 0;
    gameOver = false; levelComplete = false; hintPos = null; bombMode = false;
    document.getElementById('modal-gameover').classList.remove('show');
    updateUI(); renderBoard(); renderTray(); saveState();
  };
  window.reviveGame = function() {
    for (let r=GRID-3; r<GRID; r++) for (let c=0; c<GRID; c++) board[r][c] = null;
    gameOver = false;
    pieces = genPieces(); placedCount = 0;
    document.getElementById('modal-gameover').classList.remove('show');
    renderBoard(); renderTray(); saveState();
  };
  window.nextLevel = function() {
    level++;
    score = 0; linesTotal = 0; placedCount = 0;
    board = Array(GRID).fill(null).map(()=>Array(GRID).fill(null));
    pieces = genPieces();
    levelComplete = false; gameOver = false;
    document.getElementById('modal-level').classList.remove('show');
    updateUI(); renderBoard(); renderTray(); saveState();
  };

  loadState();
  if (pieces.every(x=>x===null)) pieces = genPieces();
  updateUI();
  renderBoard();
  renderTray();
})();
</script>
</body>
</html>
