<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Órbita Tech — Notícias, análises e reportagens de tecnologia</title>
<meta name="description" content="As últimas notícias, reviews, entrevistas e reportagens sobre tecnologia, Apple e o universo digital.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><circle cx=%2212%22 cy=%2212%22 r=%229%22 fill=%22%230071e3%22/></svg>">
<link rel="stylesheet" href="assets/css/main.css">

<body>

<div id="nav-root"></div>
<div id="ticker-root"></div>

<main class="container">
  <div id="hero-root"></div>

  <div class="layout-2col">
    <div>
      <div class="grid grid-3" id="grid-main"></div>

      <div class="section-head"><h2 class="section-title">Em destaque</h2></div>
      <div class="grid grid-2" id="grid-overlay"></div>

      <!-- espaço de anúncio in-feed -->

        <span class="ad-label">Espaço Publicitário</span>

      </div>
      <div class="sidebar-box glass">

      </div>
      <div class="sidebar-box glass">
        <h3>Tópicos</h3>
        <div style="display:flex;flex-wrap:wrap;gap:8px;" id="sidebar-tags"></div>
      </div>
      <div class="ad-slot ad-rectangle glass" style="margin:0 auto;">
        <span class="ad-label">Espaço Publicitário</span>
        <span class="ad-size">300 × 250</span>
      </div>
    </aside>
  </div>

  <div class="section-head"><h2 class="section-title">Editorias</h2></div>
  <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;" id="categories-strip"></div>

<div id="footer-root"></div>

<script src="assets/js/seed-data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/home.js"></script>

  renderNav();
  document.getElementById("ad-mid").outerHTML = adSlot("infeed");
  renderHome();
  renderFooter();
</script>

</html>
